<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Grid Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="grid-container">
    <!-- Imagen 1: Foggy beach con roca grande (izquierda arriba, alta) -->
    <figure class="grid-item item-foggy-beach">
      <img
        src="https://images.unsplash.com/photo-1504893524553-b855bce32c67?w=800&q=80"
        alt="A foggy beach with a large rock formation in the foreground"
      >
    </figure>

    <!-- Imagen 2: Comida en mesa (centro arriba, bajita) -->
    <figure class="grid-item item-food">
      <img
        src="https://images.unsplash.com/photo-1547592180-85f173990554?w=800&q=80"
        alt="A table topped with plates and bowls of food"
      >
    </figure>

    <!-- Imagen 3: Edificios blancos (derecha arriba, alta) -->
    <figure class="grid-item item-buildings">
      <img
        src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=800&q=80"
        alt="A row of white apartment buildings next to a street"
      >
    </figure>

    <!-- Imagen 4: Sala blanca con ventana redonda (izquierda abajo, bajita) -->
    <figure class="grid-item item-living-room">
      <img
        src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=800&q=80"
        alt="A living room with a white couch and a round window"
      >
    </figure>

    <!-- Imagen 5: Puerta roja con árbol (centro abajo, muy alta) -->
    <figure class="grid-item item-red-door">
      <img
        src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800&q=80"
        alt="A building with a red door and a tree in front of it"
      >
    </figure>

    <!-- Imagen 6: Playa desde colina (derecha abajo, bajita) -->
    <figure class="grid-item item-beach-hill">
      <img
        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80"
        alt="A view of a beach from the top of a hill"
      >
    </figure>
  </main>

</body>
</html>
